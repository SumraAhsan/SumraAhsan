<svg width="100%" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E9FF"/>
      <stop offset="100%" stop-color="#E6D7F5"/>
    </linearGradient>
    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0F7"/>
      <stop offset="100%" stop-color="#FFD6E8"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAF6FF"/>
      <stop offset="100%" stop-color="#AEE2FF"/>
    </linearGradient>
    <linearGradient id="cardGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E9FF"/>
      <stop offset="100%" stop-color="#FFD6E8"/>
    </linearGradient>
    <filter id="cardGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="24" fill="#FFFDFC"/>

  <!-- Card 1 -->
  <g>
    <rect x="30" y="30" width="255" height="200" rx="20" fill="url(#cardGrad1)">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="157" cy="90" r="26" fill="#FFFFFF" opacity="0.7" filter="url(#cardGlow)"/>
    <text x="157" y="100" font-size="26" text-anchor="middle">🎓</text>
    <text x="157" y="145" font-size="15" font-weight="700" fill="#6B4A85" text-anchor="middle" font-family="Georgia, serif">BS AI Student</text>
    <text x="157" y="168" font-size="11.5" fill="#8C6AA8" text-anchor="middle" font-family="Verdana, sans-serif">University of Agriculture</text>
    <text x="157" y="184" font-size="11.5" fill="#8C6AA8" text-anchor="middle" font-family="Verdana, sans-serif">Faisalabad</text>
    <text x="157" y="210" font-size="16" fill="#D9B8F0" text-anchor="middle">✦
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Card 2 -->
  <g>
    <rect x="315" y="30" width="255" height="200" rx="20" fill="url(#cardGrad2)">
      <animate attributeName="opacity" values="1;0.9;1" dur="4.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="442" cy="90" r="26" fill="#FFFFFF" opacity="0.7" filter="url(#cardGlow)"/>
    <text x="442" y="100" font-size="26" text-anchor="middle">💼</text>
    <text x="442" y="145" font-size="15" font-weight="700" fill="#8C5C7A" text-anchor="middle" font-family="Georgia, serif">ML Engineering Intern</text>
    <text x="442" y="168" font-size="11.5" fill="#A87A96" text-anchor="middle" font-family="Verdana, sans-serif">FlyRank AI</text>
    <text x="442" y="210" font-size="16" fill="#FFB6D9" text-anchor="middle">✦
      <animate attributeName="opacity" values="1;0.3;1" dur="3s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Card 3 -->
  <g>
    <rect x="600" y="30" width="255" height="200" rx="20" fill="url(#cardGrad3)">
      <animate attributeName="opacity" values="0.9;1;0.9" dur="4.2s" repeatCount="indefinite"/>
    </rect>
    <circle cx="727" cy="90" r="26" fill="#FFFFFF" opacity="0.7" filter="url(#cardGlow)"/>
    <text x="727" y="100" font-size="26" text-anchor="middle">📜</text>
    <text x="727" y="145" font-size="15" font-weight="700" fill="#39587A" text-anchor="middle" font-family="Georgia, serif">IBM Certified</text>
    <text x="727" y="168" font-size="11.5" fill="#5C7B9A" text-anchor="middle" font-family="Verdana, sans-serif">Generative AI &amp; Agentic AI</text>
    <text x="727" y="210" font-size="16" fill="#AEE2FF" text-anchor="middle">✦
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.8s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Card 4 -->
  <g>
    <rect x="885" y="30" width="285" height="200" rx="20" fill="url(#cardGrad4)">
      <animate attributeName="opacity" values="1;0.9;1" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <circle cx="1027" cy="90" r="26" fill="#FFFFFF" opacity="0.7" filter="url(#cardGlow)"/>
    <text x="1027" y="100" font-size="26" text-anchor="middle">🤖</text>
    <text x="1027" y="145" font-size="15" font-weight="700" fill="#6B4A85" text-anchor="middle" font-family="Georgia, serif">Agentic AI Builder</text>
    <text x="1027" y="168" font-size="11.5" fill="#8C6AA8" text-anchor="middle" font-family="Verdana, sans-serif">Multi-agent systems &amp;</text>
    <text x="1027" y="184" font-size="11.5" fill="#8C6AA8" text-anchor="middle" font-family="Verdana, sans-serif">automation</text>
    <text x="1027" y="210" font-size="16" fill="#D9B8F0" text-anchor="middle">✦
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.2s" repeatCount="indefinite"/>
    </text>
  </g>
</svg>
