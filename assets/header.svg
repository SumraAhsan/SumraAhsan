<svg width="100%" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF6FF">
        <animate attributeName="stop-color" values="#FDF6FF;#EDE1FA;#FFE1F0;#DCEFFF;#FDF6FF" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#E9DCF9">
        <animate attributeName="stop-color" values="#E9DCF9;#FFE1F0;#DCEFFF;#E9DCF9;#E9DCF9" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#DCEFFF">
        <animate attributeName="stop-color" values="#DCEFFF;#E9DCF9;#FFE1F0;#DCEFFF;#DCEFFF" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D9C6F0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FFD1E8" stop-opacity="0.55"/>
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BFE3FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#E4D4FA" stop-opacity="0.5"/>
    </linearGradient>

    <radialGradient id="moonGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFDF6"/>
      <stop offset="100%" stop-color="#F3E9FF"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="280" rx="26" fill="url(#bgGrad)"/>

  <!-- Crescent moon -->
  <g transform="translate(1080,60)">
    <circle cx="0" cy="0" r="26" fill="url(#moonGrad)" filter="url(#softGlow)"/>
    <circle cx="10" cy="-6" r="22" fill="url(#bgGrad)"/>
    <animateTransform attributeName="transform" type="translate" values="1080,60;1080,68;1080,60" dur="6s" repeatCount="indefinite"/>
  </g>

  <!-- Drifting clouds -->
  <g opacity="0.55" fill="#FFFFFF">
    <g transform="translate(120,50)">
      <ellipse cx="0" cy="0" rx="38" ry="14"/>
      <ellipse cx="26" cy="-6" rx="26" ry="12"/>
      <ellipse cx="-28" cy="4" rx="22" ry="10"/>
      <animateTransform attributeName="transform" type="translate" values="120,50;160,50;120,50" dur="18s" repeatCount="indefinite"/>
    </g>
    <g transform="translate(950,190)">
      <ellipse cx="0" cy="0" rx="34" ry="12"/>
      <ellipse cx="24" cy="-5" rx="20" ry="10"/>
      <ellipse cx="-24" cy="3" rx="18" ry="9"/>
      <animateTransform attributeName="transform" type="translate" values="950,190;900,190;950,190" dur="20s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- Twinkling stars / sparkles -->
  <g fill="#D9B8F0">
    <text x="70" y="130" font-size="20" opacity="0.9">✦
      <animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/>
    </text>
    <text x="200" y="220" font-size="16" fill="#FFB6D9">✦
      <animate attributeName="opacity" values="1;0.2;1" dur="2.4s" repeatCount="indefinite"/>
    </text>
    <text x="330" y="70" font-size="14" fill="#AEE2FF">✧
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3.6s" repeatCount="indefinite"/>
    </text>
    <text x="1020" y="150" font-size="18" fill="#D9B8F0">✦
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" repeatCount="indefinite"/>
    </text>
    <text x="880" y="90" font-size="14" fill="#FFB6D9">✧
      <animate attributeName="opacity" values="1;0.3;1" dur="3.2s" repeatCount="indefinite"/>
    </text>
    <text x="600" y="45" font-size="16" fill="#AEE2FF">✦
      <animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/>
    </text>
    <text x="150" y="45" font-size="12" fill="#D9B8F0">⋆
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </text>
    <text x="1100" y="220" font-size="12" fill="#FFB6D9">⋆
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.6s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- Tiny butterfly -->
  <g transform="translate(1000,110)" fill="#F3C6E0" opacity="0.85">
    <path d="M0,0 C-14,-14 -26,-4 -20,8 C-14,18 -4,10 0,0 Z"/>
    <path d="M0,0 C14,-14 26,-4 20,8 C14,18 4,10 0,0 Z"/>
    <animateTransform attributeName="transform" type="translate" values="1000,110;1000,96;1000,110" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- Title -->
  <g filter="url(#softGlow)" text-anchor="middle">
    <text x="600" y="128" font-family="Georgia, 'Segoe UI', serif" font-size="46" font-weight="600" fill="#6B4A85">
      ✨ Sumra Ahsan ✨
    </text>
  </g>

  <g text-anchor="middle" font-family="'Segoe UI', Verdana, sans-serif">
    <text x="600" y="170" font-size="19" fill="#7A5C96" font-weight="500">AI Engineering Student</text>
    <text x="600" y="198" font-size="17" fill="#8C6AA8">ML Engineering Intern · Agentic AI Builder</text>
  </g>

  <!-- Soft waves at the base -->
  <path d="M0,250 C200,230 300,270 500,250 C700,230 800,270 1000,250 C1100,240 1150,250 1200,245 L1200,280 L0,280 Z" fill="url(#waveGrad1)"/>
  <path d="M0,260 C220,245 320,275 520,258 C720,240 820,275 1020,258 C1110,250 1160,258 1200,255 L1200,280 L0,280 Z" fill="url(#waveGrad2)"/>
</svg>
